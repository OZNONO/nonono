<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Random?</title>
  <link rel="stylesheet" href="style.css">
  <script src="data/sdvx_songs.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="header text-center">
      <a href="../index.html"><h1>NONO SDVX</h1></a>
    </header>

    <section id="message1">
      <div id="lastupdatedate">last update : 불러오는 중</div>
      <div id="song-count"></div>
      <p>
        사운드볼텍스 17~20레벨 악곡을 무작위로 추천해 드립니다.<br>
        추첨할 악곡 수를 아래서 골라주세요.
      </p>
    </section>

    <p id="message2">추첨 버튼을 눌러주세요</p>

    <section class="controls" aria-label="추천 설정">
      <select name="selecthowmany" id="select1" aria-label="추천 곡 수">
        <option value="1">1</option><option value="2">2</option>
        <option value="3" selected>3</option><option value="4">4</option>
        <option value="5">5</option><option value="6">6</option>
        <option value="7">7</option><option value="8">8</option>
        <option value="9">9</option><option value="10">10</option>
      </select>
      <button type="button" class="btn btn-primary" id="draw-button" disabled>추첨</button>
      <button type="button" class="btn btn-secondary" id="copy-image">사진으로 복사</button>
      <button type="button" class="btn btn-primary" id="copy-text">텍스트로 복사</button>
    </section>

    <section class="levels" aria-label="추천 레벨">
      <label><input type="checkbox" name="level" value="17"> 17</label>
      <label><input type="checkbox" name="level" value="18" checked> 18</label>
      <label><input type="checkbox" name="level" value="19"> 19</label>
      <label><input type="checkbox" name="level" value="20"> 20</label>
      <button type="button" class="link-button" id="select-all">전체 선택</button>
      <button type="button" class="link-button" id="clear-all">전체 해제</button>
    </section>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div id="results" aria-live="polite"></div>

    <section class="search-area">
      <form id="search-form">
        <input type="search" id="search-input" placeholder="Dyscontrolled Galaxy" aria-label="Search">
        <button class="btn btn-outline" type="submit">Search</button>
      </form>
      <ul id="search-results"></ul>
    </section>

    <footer>
      곡 및 자켓 정보 출처:
      <a href="https://sdvx.in/" target="_blank" rel="noopener noreferrer">SDVX譜面保管所</a>
    </footer>
  </main>
</body>
</html>
