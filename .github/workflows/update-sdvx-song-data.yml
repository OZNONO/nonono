name: Update SDVX song data

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sdvx-song-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and validate song data
        run: |
          python sdvx/recommend_auto/scripts/update_sdvx_data.py
          python sdvx/recommend_auto/scripts/validate_data.py

      - name: Commit changed data only
        run: |
          DATA_FILE="sdvx/recommend_auto/data/sdvx_songs.json"
          if git diff --quiet -- "$DATA_FILE"; then
            echo "Song data is unchanged; no commit created."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$DATA_FILE"
          git commit -m "chore(sdvx): update song data"
          git push
